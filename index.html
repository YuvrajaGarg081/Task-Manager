<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Task Manager</title>
</head>
<body>
    <header class="header">
        <h1>Task Manager</h1>
    </header>
    
    <main class="hero">
        <div class="mainbar">
            <h2>Task List</h2>
            <ol id="task-list"></ol>
        </div>
        <div class="sidebar">
            <h2>Task Form</h2>
            <label for="">Task Name:</label>
            <input type="text" name="" id="tname" placeholder="Enter the name of task"/>
            <button id="addBtn">Add Task</button>
        </div>
    </main>
    <footor class="footer">
        <p>&copy; 2026 All Right are reserved.</p>
    </footor>
    <script src="script.js"></script>
</body>
</html>
